name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  quality:
    name: Lint, typecheck, tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crm_master
          POSTGRES_PASSWORD: crm_master
          POSTGRES_DB: crm_master
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://crm_master:crm_master@localhost:5432/crm_master?schema=public
      DIRECT_URL: postgresql://crm_master:crm_master@localhost:5432/crm_master?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      # Applique les migrations sur la base Postgres du service, à l'identique
      # de scripts/vercel-migrate.sh en production — nécessaire pour que les
      # tests d'intégration (tests/*.test.ts) trouvent un schéma à jour.
      - run: npx prisma migrate deploy

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test
